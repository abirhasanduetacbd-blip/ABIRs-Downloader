name: Build Android App (Cloud Builder)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App with Gradle
        run: |
          cd android_app
          gradle wrapper
          ./gradlew assembleDebug assembleRelease --no-daemon || gradle assembleRelease

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ABIRs-Downloader-Android-Builds
          path: |
            android_app/app/build/outputs/apk/**/*.apk
            android_app/app/build/outputs/bundle/**/*.aab
            android_app/build/outputs/**/*.apk
