<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABIR's Downloader - Fast & Free Media Downloader</title>
  <meta name="description" content="Download HD Videos and MP3 Audio from YouTube, Facebook, Instagram, TikTok, and Spotify instantly.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080c14;
      --card-bg: rgba(21, 28, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-start: #6366f1;
      --primary-end: #a855f7;
      --accent: #ec4899;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.8);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow-glow: 0 10px 30px -5px rgba(99, 102, 241, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 30px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      font-size: 13px;
      font-weight: 600;
      color: #818cf8;
      margin-bottom: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #a855f7 70%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Glass Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    .input-group-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .url-input {
      width: 100%;
      padding: 18px 120px 18px 20px;
      border-radius: var(--radius-md);
      background: var(--input-bg);
      border: 2px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
    }

    .url-input:focus {
      border-color: var(--primary-start);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
      background: rgba(15, 23, 42, 0.95);
    }

    .input-actions {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 6px;
    }

    .btn-icon-subtle {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-icon-subtle:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--shadow-glow);
      transition: all 0.25s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px -5px rgba(99, 102, 241, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Platform Pills */
    .platforms-ticker {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .platform-tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Alert Banner */
    .alert-banner {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      margin-top: 16px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    .alert-banner.info {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
    }

    .alert-banner.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .alert-banner.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    /* Media Result Card */
    #resultCard {
      display: none;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .media-header {
      display: flex;
      gap: 18px;
      margin-bottom: 22px;
      align-items: center;
    }

    .thumb-wrapper {
      position: relative;
      width: 140px;
      height: 90px;
      border-radius: var(--radius-md);
      overflow: hidden;
      flex-shrink: 0;
      background: #000;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .duration-tag {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .media-info {
      flex: 1;
      min-width: 0;
    }

    .media-title {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-main);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .media-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .uploader-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #c084fc;
      font-weight: 600;
    }

    /* Selector */
    .section-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .select-custom {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      margin-bottom: 18px;
      transition: all 0.2s ease;
    }

    .select-custom:focus {
      border-color: var(--primary-start);
    }

    .select-custom option {
      background: #0f172a;
      color: var(--text-main);
      padding: 10px;
    }

    /* Download History */
    .history-card {
      margin-top: 30px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .history-header h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .clear-history-btn {
      font-size: 12px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
    }

    .clear-history-btn:hover {
      color: var(--danger);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }

    .history-title {
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 380px;
    }

    .history-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 540px) {
      .header h1 { font-size: 32px; }
      .thumb-wrapper { width: 110px; height: 75px; }
      .url-input { padding-right: 90px; font-size: 14px; }
      .history-title { max-width: 200px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand-badge">
        <span class="status-dot"></span> Server Active (Local 127.0.0.1)
      </div>
      <h1>ABIR's Downloader</h1>
      <p>Download HD Videos & MP3 Audio from your favorite platforms</p>
    </header>

    <!-- Main Search Form -->
    <main class="glass-card">
      <div class="input-group-wrapper">
        <input 
          type="url" 
          id="urlInput" 
          class="url-input" 
          placeholder="Paste video or audio link here..." 
          autocomplete="off"
        >
        <div class="input-actions">
          <button id="pasteBtn" class="btn-icon-subtle" title="Paste link from clipboard">📋 Paste</button>
          <button id="clearBtn" class="btn-icon-subtle" title="Clear input">✕</button>
        </div>
      </div>

      <button id="fetchBtn" class="btn-primary">
        <span>🔍 Fetch Download Options</span>
      </button>

      <div id="alertBanner" class="alert-banner"></div>

      <div class="platforms-ticker">
        <span class="platform-tag">YouTube</span>
        <span class="platform-tag">Instagram</span>
        <span class="platform-tag">Facebook</span>
        <span class="platform-tag">TikTok</span>
        <span class="platform-tag">Spotify</span>
        <span class="platform-tag">Twitter / X</span>
      </div>
    </main>

    <!-- Media Result Card -->
    <section id="resultCard" class="glass-card">
      <div class="media-header">
        <div class="thumb-wrapper">
          <img id="mediaThumb" src="" alt="Thumbnail">
          <span id="mediaDuration" class="duration-tag">--:--</span>
        </div>
        <div class="media-info">
          <h2 id="mediaTitle" class="media-title">Media Title</h2>
          <div class="media-meta">
            <span class="uploader-badge">👤 <span id="mediaUploader">Channel</span></span>
          </div>
        </div>
      </div>

      <div class="section-label">Select Download Format & Quality</div>
      <select id="formatSelect" class="select-custom"></select>

      <button id="downloadBtn" class="btn-primary" style="background: linear-gradient(135deg, #10b981, #059669);">
        <span>⚡ Start Instant Download</span>
      </button>
    </section>

    <!-- Download History -->
    <section id="historySection" class="glass-card history-card" style="display: none;">
      <div class="history-header">
        <h3>Recent Downloads</h3>
        <button id="clearHistoryBtn" class="clear-history-btn">Clear History</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>
  </div>

  <script>
    const urlInput = document.getElementById("urlInput");
    const pasteBtn = document.getElementById("pasteBtn");
    const clearBtn = document.getElementById("clearBtn");
    const fetchBtn = document.getElementById("fetchBtn");
    const alertBanner = document.getElementById("alertBanner");

    const resultCard = document.getElementById("resultCard");
    const mediaThumb = document.getElementById("mediaThumb");
    const mediaTitle = document.getElementById("mediaTitle");
    const mediaUploader = document.getElementById("mediaUploader");
    const mediaDuration = document.getElementById("mediaDuration");
    const formatSelect = document.getElementById("formatSelect");
    const downloadBtn = document.getElementById("downloadBtn");

    const historySection = document.getElementById("historySection");
    const historyList = document.getElementById("historyList");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");

    let currentMediaData = null;

    // Register Service Worker for PWA compliance
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }

    // Parse shared URL query parameter from Android Intent (?url=...)
    window.addEventListener("DOMContentLoaded", () => {

      const params = new URLSearchParams(window.location.search);
      const sharedUrl = params.get("url") || params.get("text");
      if (sharedUrl) {
        const urlMatch = sharedUrl.match(/(https?:\/\/[^\s]+)/);
        const cleanUrl = urlMatch ? urlMatch[0] : sharedUrl;
        urlInput.value = cleanUrl;
        fetchBtn.click();
      }
    });

    // Load history on start
    renderHistory();


    // Clipboard Paste
    pasteBtn.onclick = async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          urlInput.value = text.trim();
          urlInput.focus();
          showAlert("Pasted link from clipboard", "info");
        }
      } catch (err) {
        showAlert("Clipboard permission denied", "error");
      }
    };

    // Clear input
    clearBtn.onclick = () => {
      urlInput.value = "";
      resultCard.style.display = "none";
      alertBanner.style.display = "none";
    };

    // Keyboard enter key
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        fetchBtn.click();
      }
    });

    // Fetch Media Analysis
    fetchBtn.onclick = async () => {
      const url = urlInput.value.trim();
      if (!url) {
        showAlert("Please enter a video or audio URL first", "error");
        return;
      }

      setFetchLoading(true);
      resultCard.style.display = "none";
      showAlert("Analyzing media link...", "info");

      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (data.success) {
          currentMediaData = data;
          mediaTitle.textContent = data.title || "Media File";
          mediaUploader.textContent = data.uploader || "Web Content";
          mediaThumb.src = data.thumbnail || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300";
          mediaDuration.textContent = data.duration || "Media";

          formatSelect.innerHTML = "";
          data.formats.forEach(fmt => {
            const opt = document.createElement("option");
            opt.value = JSON.stringify({ id: fmt.id, type: fmt.type });
            opt.textContent = fmt.label;
            formatSelect.appendChild(opt);
          });

          resultCard.style.display = "block";
          showAlert("Analysis complete! Select format and download.", "success");
        } else {
          showAlert(data.error || "Could not fetch download options for this URL.", "error");
        }
      } catch (err) {
        showAlert("Failed to connect to backend server. Make sure server.py is running.", "error");
      } finally {
        setFetchLoading(false);
      }
    };

    // Start Download
    downloadBtn.onclick = async () => {
      if (!urlInput.value || !formatSelect.value) return;

      const url = urlInput.value.trim();
      const formatObj = JSON.parse(formatSelect.value);

      setDownloadLoading(true);
      showAlert("Preparing your download... This may take a few seconds.", "info");

      try {
        const downloadUrl = `/api/download?url=${encodeURIComponent(url)}&format_id=${encodeURIComponent(formatObj.id)}&type=${encodeURIComponent(formatObj.type)}`;
        
        // Save to History
        saveToHistory(currentMediaData ? currentMediaData.title : "Downloaded Media");

        // Trigger direct browser download
        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = "";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        setTimeout(() => {
          showAlert("Download request sent to browser!", "success");
          setDownloadLoading(false);
        }, 2500);

      } catch (err) {
        showAlert("Download failed: " + err.message, "error");
        setDownloadLoading(false);
      }
    };

    // Helper functions
    function showAlert(message, type) {
      alertBanner.textContent = message;
      alertBanner.className = `alert-banner ${type}`;
      alertBanner.style.display = "flex";
    }

    function setFetchLoading(isLoading) {
      if (isLoading) {
        fetchBtn.disabled = true;
        fetchBtn.innerHTML = `<div class="spinner"></div> <span>Analyzing Link...</span>`;
      } else {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = `<span>🔍 Fetch Download Options</span>`;
      }
    }

    function setDownloadLoading(isLoading) {
      if (isLoading) {
        downloadBtn.disabled = true;
        downloadBtn.innerHTML = `<div class="spinner"></div> <span>Processing File...</span>`;
      } else {
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = `<span>⚡ Start Instant Download</span>`;
      }
    }

    function saveToHistory(title) {
      let history = JSON.parse(localStorage.getItem("downloader_history") || "[]");
      history.unshift({ title, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      history = history.slice(0, 5); // Keep last 5
      localStorage.setItem("downloader_history", JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem("downloader_history") || "[]");
      if (history.length === 0) {
        historySection.style.display = "none";
        return;
      }

      historySection.style.display = "block";
      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <span class="history-title">🎵 ${escapeHtml(item.title)}</span>
          <span class="history-time">${item.time}</span>
        </div>
      `).join("");
    }

    clearHistoryBtn.onclick = () => {
      localStorage.removeItem("downloader_history");
      renderHistory();
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
